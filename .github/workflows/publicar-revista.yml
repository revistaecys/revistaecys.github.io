name: Publicar Revista ECYS y detectar ediciones

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: revista-ecys-pages
  cancel-in-progress: true

jobs:
  publicar:
    name: Actualizar index.html y publicar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Probar generador de catálogo
        run: python3 -m unittest discover -s pruebas -p 'test_*.py' -v

      - name: Detectar carpetas y actualizar index.html y ediciones.json
        run: |
          python3 scripts/generar_catalogo.py --root .
          python3 scripts/generar_catalogo.py --root . --check

      - name: Preparar GitHub Pages sin Jekyll
        run: touch .nojekyll

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empaquetar HTML, ediciones y recursos
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Desplegar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
